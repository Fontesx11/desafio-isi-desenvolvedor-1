services:
  desafio-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ./.docker/entrypoint.sh
    container_name: fontes-desafio-api
    ports:
      - 3000:3000
    environment:
      - DB_HOST=desafio-db
      - DB_PORT=5432
      - DATABASE_URL=postgresql://postgres:postgres@desafio-db:5432/desafio?sslmode=disable
    volumes:
      - ./backend:/home/node/app
      - app-node-modules:/home/node/app/node_modules
    depends_on:
      - desafio-db

  desafio-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    entrypoint: ./.docker/entrypoint.sh
    container_name: fontes-desafio-web
    ports:
      - 5173:5173
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
    volumes:
      - ./frontend:/home/node/app
      - web-node-modules:/home/node/app/node_modules
    depends_on:
      - desafio-app

  desafio-db:
    image: postgres:18-alpine
    container_name: fontes-desafio-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=desafio
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
  app-node-modules:
  web-node-modules:
